# rifle.conf — controls how ranger opens files
# Format: condition1, condition2, ... = command
# Conditions: ext (extension), mime (MIME type), name, path, has (command exists), env, flag, label, else
# Flags: f (fork/background), t (run in terminal), r (root), l (label)

# ─── Editors ────────────────────────────────────────────────────────────────
# Text files → nvim (or fallback to nano)
ext py|rb|js|ts|jsx|tsx|json|yaml|yml|toml|ini|cfg|conf|sh|bash|zsh|fish  = nvim -- "$@"
ext md|txt|rst|org|log|csv|xml|html|htm|css|scss|sass|less                = nvim -- "$@"
ext go|rs|java|cpp|c|h|hpp|cs|php|lua|vim|ex|exs|erl|hs|ml|r|jl          = nvim -- "$@"
ext Makefile|Dockerfile|Vagrantfile|.gitignore|.env|.envrc                = nvim -- "$@"
mime text, label editor  = nvim -- "$@"
mime text, label pager   = "$PAGER" -- "$@"

# ─── Images ─────────────────────────────────────────────────────────────────
mime ^image, has open, X, flag f = open "$@"

# ─── Video / Audio ──────────────────────────────────────────────────────────
mime ^video, has open, X, flag f = open "$@"
mime ^audio, has open, X, flag f = open "$@"

# ─── PDF ────────────────────────────────────────────────────────────────────
ext pdf, has open, X, flag f = open "$@"

# ─── Archives ───────────────────────────────────────────────────────────────
ext 7z,  has 7z     = 7z x -- "$@"
ext tar, has tar    = tar xf "$@"
ext gz,  has tar    = tar xzf "$@"
ext bz2, has tar    = tar xjf "$@"
ext xz,  has tar    = tar xJf "$@"
ext zip, has unzip  = unzip -- "$@"
ext rar, has unrar  = unrar x -- "$@"

# ─── Web ────────────────────────────────────────────────────────────────────
ext html|htm, has open, X, flag f = open "$@"

# ─── macOS fallback — open with default app ─────────────────────────────────
has open, X, flag f = open "$@"

# ─── Final fallback — open in nvim ──────────────────────────────────────────
else = nvim -- "$@"
